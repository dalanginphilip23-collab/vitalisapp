<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 124" fill="none" role="img">
  <!--
    PLACEHOLDER SLOT — replace me with the real Vitalis QR code.

    How to swap in the real QR later (no code changes needed):
      1. Add the real QR image as:  frontend/public/landing/qr-code.png
      2. That's it. QrCode prefers qr-code.png automatically and falls
         back to this template only while qr-code.png is absent.
    Squares / dots / finder patterns are decorative simulation, not
    scannable.
  -->
  <!-- Scan-frame corners -->
  <g stroke="#CDFB47" stroke-width="3.5" stroke-linecap="round">
    <path d="M4 14v-6a4 4 0 0 1 4-4h6" />
    <path d="M110 4h6a4 4 0 0 1 4 4v6" />
    <path d="M120 110v6a4 4 0 0 1-4 4h-6" />
    <path d="M14 120H8a4 4 0 0 1-4-4v-6" />
  </g>

  <!-- Simulated data modules -->
  <pattern id="qrModules" width="12" height="12" patternUnits="userSpaceOnUse" x="18" y="18">
    <rect width="5.5" height="5.5" rx="1" fill="#F6F6F4" opacity="0.5" />
    <rect x="6.5" y="6.5" width="3.5" height="3.5" rx="0.9" fill="#F6F6F4" opacity="0.28" />
  </pattern>
  <rect x="17" y="17" width="90" height="90" fill="url(#qrModules)" />

  <!-- Finder patterns (top-left, top-right, bottom-left) -->
  <g fill="#F6F6F4">
    <rect x="18" y="18" width="24" height="24" rx="4" />
    <rect x="82" y="18" width="24" height="24" rx="4" />
    <rect x="18" y="82" width="24" height="24" rx="4" />
  </g>
  <g fill="#0F1412" opacity="0.92">
    <rect x="23" y="23" width="14" height="14" rx="2.4" />
    <rect x="87" y="23" width="14" height="14" rx="2.4" />
    <rect x="23" y="87" width="14" height="14" rx="2.4" />
  </g>
  <g fill="#F6F6F4">
    <rect x="26" y="26" width="8" height="8" rx="1.4" />
    <rect x="90" y="26" width="8" height="8" rx="1.4" />
    <rect x="26" y="90" width="8" height="8" rx="1.4" />
  </g>

  <!-- Center brand chip -->
  <rect x="47" y="47" width="30" height="30" rx="8" fill="#0F1412" />
  <rect x="50" y="50" width="24" height="24" rx="6" fill="#CDFB47" />
  <path d="M56.2 55.5 62 68l5.8-12.5h3.1L62.6 71h-1.2L53.1 55.5z" fill="#0F1412" /></svg>
