<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d110c" />
    <script>
      /* No-flash theme init: apply the saved theme class before first paint.
         Mirrors ThemeContext (key: vitalis_theme; values: light|dark|system). */
      (function () {
        try {
          var pref = localStorage.getItem('vitalis_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = pref === 'dark' || (!pref || pref === 'system') ? (pref === 'dark' || prefersDark) : false;
          document.documentElement.classList.add(dark ? 'dark-theme' : 'light-theme');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0d110c' : '#f5f7f1');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Vitalis — AI-powered fitness tracking, nutrition, sleep and coaching." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vitalis — AI-powered fitness tracking" />
    <meta property="og:description" content="Track workouts, nutrition, sleep and coaching with AI." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Vitalis — AI-powered fitness tracking" />
    <meta name="twitter:description" content="Track workouts, nutrition, sleep and coaching with AI." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vitalis" />
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="preload" as="image" href="/Loading_green.png" fetchpriority="low" />
    <title>Vitalis</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:24px;text-align:center;font-family:sans-serif">Vitalis needs JavaScript to run. Please enable it and reload.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
